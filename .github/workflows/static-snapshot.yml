name: Build static snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-static-snapshot-main
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current main and a merged registry PR
        run: python scripts/check_publication.py "$GITHUB_SHA"
      - name: Install reviewed validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate reviewed registry and test snapshot builder
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -p test_snapshot.py -v
      - name: Build complete snapshot
        run: python scripts/build_snapshot.py --registry-ref "$GITHUB_SHA" --out dist
      - name: Reject superseded main before making artifact available
        run: python scripts/check_publication.py "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-static-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      # No Cloudflare deployment or credentials. A separately approved publisher
      # must verify current main again and publish this entire asset manifest once.
