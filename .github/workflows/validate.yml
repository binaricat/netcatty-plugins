name: Validate index
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run validator and dependencies from the trusted base, never PR code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate
          sparse-checkout: |
            index.json
            catalog.json
          sparse-checkout-cone-mode: false
      - name: Install trusted validator dependencies
        run: python -m pip install --disable-pip-version-check -r trusted/requirements.txt
      - name: Test trusted validator
        run: python -m unittest discover -s trusted/tests -v
      - name: Validate candidate data and preserve history
        if: github.event_name == 'pull_request'
        run: python trusted/scripts/validate.py --root candidate --baseline trusted/index.json --download
      - name: Validate main snapshot
        if: github.event_name != 'pull_request'
        run: python trusted/scripts/validate.py --root candidate --download
